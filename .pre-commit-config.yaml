# EXONYM repository policy hooks
# Install with:  pre-commit install
# Run manually with:  pre-commit run --all-files

repos:
  - repo: local
    hooks:
      - id: exonym-verify
        name: EXONYM repository isolation and schema audit
        description: Rejects target identifiers, research payloads, symlinks,
          and schema violations outside candidate/ workspaces.
        entry: python -c "import sys; sys.path.insert(0, 'src'); from exonym.isolation import main; raise SystemExit(main(['--root', '.']))"
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
